<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VYRAL launch trailer</title>
    <style>
      @font-face {
        font-family: "Geist";
        src: url(fonts/Geist-Variable.woff2) format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url(fonts/GeistMono-Variable.woff2) format("woff2");
        font-weight: 100 900;
      }
      :root {
        --bg: #050506;
        --ink: #f4f4f5;
        --ink2: #a1a1aa;
        --ink3: #71717a;
        --ink4: #3f3f46;
        --edge: #1d1d21;
        --panel: #09090b;
        --accent: #2cf59e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      body {
        font-family: "Geist", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
        font-kerning: normal;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
      }
      .abs {
        position: absolute;
      }
      .fill {
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      .mono {
        font-family: "Geist Mono", monospace;
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .dot {
        color: var(--accent);
      }
      .acc {
        color: var(--accent);
      }
      .kern {
        margin-left: 0.04em;
      }
      .hl {
        position: absolute;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--ink);
      }
      .hl-row {
        display: block;
      }
      .hl-mask {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding: 0.08em 0.04em 0.14em;
        margin: -0.08em -0.04em -0.14em;
      }
      .hl-in {
        display: inline-block;
      }
      .ch {
        display: inline-block;
        white-space: pre;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
        visibility: hidden;
        background: var(--bg);
      }
      .card {
        position: absolute;
        width: 420px;
        height: 746px;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid #1f1f24;
      }
      .toast {
        position: absolute;
        left: 0;
        width: 820px;
        height: 100px;
        border-radius: 20px;
        background: #0c0c0f;
        border: 1px solid #222228;
        display: flex;
        align-items: center;
        padding: 0 28px;
        gap: 22px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        border: 1px solid #2a2a30;
        border-radius: 7px;
        padding: 3px 9px;
        font-size: 13px;
        color: var(--ink2);
        line-height: 1.2;
      }
      #flash {
        z-index: 20;
        visibility: hidden;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, #fff 22%, #fff 78%, rgba(255, 255, 255, 0) 100%);
        box-shadow: 0 0 34px 8px rgba(255, 255, 255, 0.55);
      }
      #grain {
        z-index: 30;
        left: -128px;
        top: -128px;
        width: 2176px;
        height: 1336px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <svg width="0" height="0" style="position: absolute">
      <filter id="mbx" x="-5%" y="0" width="110%" height="100%" color-interpolation-filters="sRGB">
        <feGaussianBlur id="mbx-blur" stdDeviation="0 0" />
      </filter>
      <filter id="mby" x="0" y="-5%" width="100%" height="110%" color-interpolation-filters="sRGB">
        <feGaussianBlur id="mby-blur" stdDeviation="0 0" />
      </filter>
    </svg>
    <script type="module" src="timeline.js"></script>
  </body>
</html>
