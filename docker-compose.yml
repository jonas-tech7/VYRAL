# Local PostgreSQL for development.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vyral
      POSTGRES_PASSWORD: vyral
      POSTGRES_DB: vyral
    ports:
      - "5432:5432"
    volumes:
      - vyral-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyral"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vyral-pg:
